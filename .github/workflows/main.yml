name: Continuous Integration

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build on Linux via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin inside container
        run: docker compose -f docker/docker-compose.yml up --build --abort-on-container-exit

      - name: Publish managed plugin
        run: |
          if git describe --tags --exact-match >/dev/null 2>&1; then
            export SEMVER=$(git describe --tags --exact-match)
          fi

          export GITHUB_SHA_SHORT=$(git rev-parse --short HEAD)

          dotnet publish managed/AcceleratorCSS_CSS/AcceleratorCSS_CSS.csproj \
            -c Release \
            -o build/addons/counterstrikesharp/plugins/AcceleratorCSS_CSS \
            -p:SEMVER="$SEMVER" \
            -p:GITHUB_SHA_SHORT="$GITHUB_SHA_SHORT"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcceleratorCSS-linux
          path: build/addons

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: AcceleratorCSS-linux
          path: ./build/linux

      - name: Archive packages
        run: |
          version="${GITHUB_REF#refs/tags/}"
          tar -czf AcceleratorCSS-${version}-linux.tar.gz -C build/linux .

      - name: Upload release archive
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: AcceleratorCSS-*.tar.gz
          tag: ${{ github.ref }}
          file_glob: true
          release_name: "${{ github.ref_name }} - Download"
